name: Build page images

# Makes the photographs, icons and share image for the Large Print Reader page and saves them in the repository.
# Run it by hand from the Actions tab, or it runs when the script below changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/make_assets.py
      - .github/workflows/assets.yml

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the script needs
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install pillow
      - name: Build the images
        run: python tools/make_assets.py largeprintreader
      - name: Save them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A largeprintreader
          git diff --cached --quiet || git commit -m "Add page images"
          git push
